# Cloudflare Pages deploy for the DOM VIRUS hub: PR -> preview, main -> staging, promote -> production.
# Adapted by hand from the Fizlet factory's deploy template (factory/templates/deploy/cloudflare.yml, as
# generated for citysmash) to this repo's build (npm run site:build -> artifacts/site). When the factory
# knows this site, replace this file with `fe deploy dom-virus --write` and keep it generated from then on.
#
# Owner adds (names only): secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID; variable CF_PREVIEW_ACCESS=on once
# Cloudflare Access covers the previews; GitHub environment `production`; Pages project dom-virus with production
# branch `production`, custom domains domvirus.com (production) and staging.domvirus.com (branch `staging`).
# Every deploy job skips with a notice (and succeeds) until the secrets exist. The Cloudflare secrets reach only
# the gate and wrangler steps (never npm ci or the build); the build step gets GAMES_READ_TOKEN only (read access
# to the game repos once they are private, scripts/github.mjs). PR previews (same-repo PRs only) deploy as
# `pr-<n>-<branch>`. Promote runs only from main.
# Staging and previews are staging-target builds (site-kit/lifecycle.mjs: robots.txt Disallow: /, no sitemap, no
# CNAME) and also answer every path with X-Robots-Tag: noindex (_headers). Production is the same build
# .github/workflows/pages.yml makes: SITE_URL=https://domvirus.com, the games' latest releases, analytics ids.
# GitHub Pages (pages.yml) keeps serving domvirus.com until the owner cuts the domain over to Cloudflare.
name: cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "The main SHA to promote to production (every check on it must have succeeded)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: dom-virus
  STAGING_HOST: staging.domvirus.com
  PRODUCTION_HOST: domvirus.com
  WRANGLER: wrangler@4.150.0

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CF_PREVIEW_ACCESS: ${{ vars.CF_PREVIEW_ACCESS }}
      HEAD_REF: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=preview skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set"; echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$CF_PREVIEW_ACCESS" != "on" ]; then
            echo "::notice title=preview skipped::set the variable CF_PREVIEW_ACCESS=on once Cloudflare Access covers *.$PROJECT.pages.dev"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.go == 'yes'
        run: npm ci
      - if: steps.gate.outputs.go == 'yes'
        env:
          SITE_URL: https://${{ env.STAGING_HOST }}
          SITE_BASE: /
          DOM_VIRUS_LATEST_RELEASES: '1'
          GAMES_READ_TOKEN: ${{ secrets.GAMES_READ_TOKEN }}
        run: |
          npm run site:build
          # Not production: no crawler indexes this deploy, whatever host or alias serves it.
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' >> artifacts/site/_headers
      - if: steps.gate.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Always prefixed: a PR can never deploy as the `production` or `staging` alias.
          branch="pr-$PR_NUMBER-$(printf '%s' "$HEAD_REF" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9-' '-' | cut -c1-20)"
          branch="${branch%-}"
          npx --yes "$WRANGLER" pages deploy "artifacts/site" --project-name="$PROJECT" --branch="$branch" --commit-hash="${{ github.event.pull_request.head.sha }}" --commit-dirty=true
          echo "::notice title=preview::https://$branch.$PROJECT.pages.dev"

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=staging skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.go == 'yes'
        run: npm ci
      - if: steps.gate.outputs.go == 'yes'
        env:
          SITE_URL: https://${{ env.STAGING_HOST }}
          SITE_BASE: /
          DOM_VIRUS_LATEST_RELEASES: '1'
          GAMES_READ_TOKEN: ${{ secrets.GAMES_READ_TOKEN }}
        run: |
          npm run site:build
          # Not production: no crawler indexes this deploy, whatever host or alias serves it.
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' >> artifacts/site/_headers
      - if: steps.gate.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy "artifacts/site" --project-name="$PROJECT" --branch=staging --commit-hash="$GITHUB_SHA" --commit-dirty=true
          echo "::notice title=staging::https://$STAGING_HOST/ (alias https://staging.$PROJECT.pages.dev)"

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://domvirus.com/
    permissions:
      contents: write
      checks: read
      statuses: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha }}
    steps:
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=promote skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; production not moved"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - if: steps.gate.outputs.go == 'yes'
        name: refuse unless the SHA is on main and every check on it succeeded (earlier promote runs aside)
        run: |
          set -euo pipefail
          case "$SHA" in *[!0-9a-f]*|"") echo "::error::sha must be a full 40-hex commit"; exit 1;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::sha must be a full 40-hex commit"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          own=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .check_suite_id)
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --jq ".check_runs[] | select(.check_suite.id != $own and .name != \"promote\") | \"\(.status) \(.conclusion) \(.name)\"")
          [ -n "$runs" ] || { echo "::error::no checks ran on $SHA"; exit 1; }
          bad=$(printf '%s\n' "$runs" | awk '$1 != "completed" || ($2 != "success" && $2 != "skipped")' || true)
          if [ -n "$bad" ]; then echo "::error::not every check on $SHA succeeded:"; printf '%s\n' "$bad"; exit 1; fi
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '[.total_count, .state] | @tsv')
          case "$state" in 0*|*success) ;; *) echo "::error::commit statuses on $SHA: $state"; exit 1;; esac
          echo "every check on $SHA succeeded:"; printf '%s\n' "$runs"
      - name: fast-forward production to the SHA
        if: steps.gate.outputs.go == 'yes'
        run: |
          git fetch origin production || true
          if git rev-parse -q --verify origin/production >/dev/null; then
            git merge-base --is-ancestor origin/production "$SHA" || { echo "::error::production is not an ancestor of $SHA: not a fast-forward"; exit 1; }
          fi
          git push origin "$SHA:refs/heads/production"
      - if: steps.gate.outputs.go == 'yes'
        run: git checkout --detach "$SHA"
      - if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.go == 'yes'
        run: npm ci
      - if: steps.gate.outputs.go == 'yes'
        env:
          SITE_URL: https://${{ env.PRODUCTION_HOST }}
          SITE_BASE: /
          DOM_VIRUS_LATEST_RELEASES: '1'
          GAMES_READ_TOKEN: ${{ secrets.GAMES_READ_TOKEN }}
          # Analytics, production only (repo variables, as in pages.yml; unset = none ships).
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: npm run site:build
      - if: steps.gate.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy "artifacts/site" --project-name="$PROJECT" --branch=production --commit-hash="$SHA" --commit-dirty=true
          echo "::notice title=production::https://$PRODUCTION_HOST/ is $SHA"
