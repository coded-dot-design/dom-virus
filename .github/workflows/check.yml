name: Playground checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm run check
      - run: npm run site:build
      - run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run site:test:browser
      - run: npm run site:test:lifecycle
      - run: npm run site:test:releases
      - name: Production build hides unready games (site-kit/lifecycle.mjs)
        run: npm run site:build && npm run site:test:lifecycle
        env:
          SITE_URL: https://domvirus.com
          SITE_BASE: /

  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the checked version once
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          tag="v$version"
          git check-ref-format "refs/tags/$tag"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "$tag already exists; keeping its original commit."
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
